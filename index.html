<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Rem - Live2D</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<link rel="stylesheet" href="./live2d/css/live2d.css" />
<style>
  html,body{margin:0;padding:0;min-height:100vh;background:#f6f4ff;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
</style>
</head>
<body>

<div id="landlord" style="left:5px;bottom:0px;">
  <div class="message" style="opacity:0"></div>
  <canvas id="live2d" width="500" height="560" class="live2d"></canvas>
  <div class="live_talk_input_body">
    <div class="live_talk_input_name_body">
      <input name="name" type="text" class="live_talk_name white_input" id="AIuserName" autocomplete="off" placeholder="你的名字" />
    </div>
    <div class="live_talk_input_text_body">
      <input name="talk" type="text" class="live_talk_talk white_input" id="AIuserText" autocomplete="off" placeholder="要和我聊什么呀？" />
      <button type="button" class="live_talk_send_btn" id="talk_send">发送</button>
    </div>
  </div>
  <input name="live_talk" id="live_talk" value="1" type="hidden" />
  <div class="live_ico_box">
    <div class="live_ico_item type_info" id="showInfoBtn"></div>
    <div class="live_ico_item type_talk" id="showTalkBtn"></div>
    <div class="live_ico_item type_music" id="musicButton"></div>
    <div class="live_ico_item type_youdu" id="youduButton"></div>
    <div class="live_ico_item type_full" id="fullButton" title="全宽/还原"></div>
    <div class="live_ico_item type_quit" id="hideButton"></div>
    <input name="live_statu_val" id="live_statu_val" value="0" type="hidden" />
    <audio src="" style="display:none;" id="live2d_bgm" data-bgm="0" preload="none"></audio>
    <!-- 需要BGM时取消注释，填https直链：
    <input name="live2dBGM" value="https://xxx.mp3" type="hidden">
    -->
    <input id="duType" value="douqilai,l2d_caihong" type="hidden">
  </div>
  <div id="remResize" title="拖动调整大小"></div>
</div>
<div id="open_live2d">召唤蕾姆</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<!-- Puter 无key聊天：把 freeChatMode 改成 'puter' 时取消下一行注释 -->
<!-- <script src="https://js.puter.com/v2/"></script> -->
<script>
var message_Path = './live2d/'; // 相对路径，Pages 子路径可用
var talkAPI = ""; // 老接口：POST {info,userid} -> {code:100000,text}，为空则走本地/免费API
var freeChatMode = "local"; // 'local' | 'puter' | 'gemini' | 'groq' | 'openrouter'
var freeChatConfig = {
  // systemPrompt: '你是蕾姆...',
  // model: 'gpt-5-nano',
  // geminiKey: 'AIza...', geminiModel: 'gemini-2.0-flash',
  // groqKey: 'gsk_...',
  // openrouterKey: 'sk-or-...'
};
</script>
<script src="./live2d/js/live2d.js"></script>
<script src="./live2d/js/message.js"></script>
</body>
</html>
