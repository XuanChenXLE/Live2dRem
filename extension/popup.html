<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body{margin:0;padding:12px 14px;min-width:150px;font:13px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#333;}
  .row{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;}
  input{width:15px;height:15px;accent-color:#6a5acd;cursor:pointer;}
  button{margin-top:10px;width:100%;padding:5px 0;border:1px solid #c9c2e8;border-radius:6px;background:#f4f2ff;color:#4a3b72;font-size:12px;cursor:pointer;}
  button:hover{background:#e9e5fb;}
</style>
</head>
<body>
<label class="row"><input type="checkbox" id="en"><span>召唤蕾姆</span></label>
<button id="reset" type="button">复位到右下角</button>
<script src="./popup.js"></script>
</body>
</html>
